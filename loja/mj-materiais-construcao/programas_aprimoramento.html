<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Programas de Aprimoramento</title>
    <link rel="stylesheet" href="programas_aprimoramento.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="aprimoramento-container">
        <!-- Header -->
        <header class="aprimoramento-header">
            <button class="btn-back" id="btnBack">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">
                <i class="fas fa-chalkboard-user"></i>
                <h1>Programas de Aprimoramento</h1>
            </div>
            <div class="header-actions">
                <div class="user-badge" id="userBadge">
                    <i class="fas fa-user-circle"></i>
                    <span id="userNameDisplay">Carregando...</span>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-card">
                <i class="fas fa-star"></i>
                <div class="stat-info">
                    <span class="stat-value" id="totalPontos">0</span>
                    <span class="stat-label">Pontos Totais</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <div class="stat-info">
                    <span class="stat-value" id="totalConcluidos">0/0</span>
                    <span class="stat-label">Concluídos</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <div class="stat-info">
                    <span class="stat-value" id="nivelAtual">Iniciante</span>
                    <span class="stat-label">Nível</span>
                </div>
            </div>
        </div>

        <div class="progresso-geral">
            <div class="progress-label">
                <span>Progresso Geral</span>
                <span id="progressoPercentual">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressoFill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="aprimoramento-tabs">
            <button class="tab-btn active" data-tab="treinamentos">
                <i class="fas fa-graduation-cap"></i>
                <span>Treinamentos</span>
            </button>
            <button class="tab-btn" data-tab="videos">
                <i class="fas fa-video"></i>
                <span>Vídeos</span>
            </button>
            <button class="tab-btn" data-tab="testes">
                <i class="fas fa-clipboard-list"></i>
                <span>Testes</span>
            </button>
        </div>

        <!-- Content -->
        <div class="aprimoramento-content">
            <!-- Tab: Treinamentos -->
            <div class="tab-pane active" id="tab-treinamentos">
                <div class="treinamentos-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchTreinamento" placeholder="Buscar treinamento...">
                    </div>
                    <button class="btn-adicionar" id="btnAdicionarTreinamento" style="display: none;">
                        <i class="fas fa-plus"></i>
                        <span>Novo Treinamento</span>
                    </button>
                </div>
                <div class="treinamentos-grid" id="treinamentosGrid">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Carregando treinamentos...</span>
                    </div>
                </div>
            </div>

            <!-- Tab: Vídeos -->
            <div class="tab-pane" id="tab-videos">
                <div class="videos-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchVideo" placeholder="Buscar vídeo...">
                    </div>
                    <button class="btn-adicionar" id="btnAdicionarVideo" style="display: none;">
                        <i class="fas fa-plus"></i>
                        <span>Novo Vídeo</span>
                    </button>
                </div>
                <div class="videos-grid" id="videosGrid">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Carregando vídeos...</span>
                    </div>
                </div>
            </div>

            <!-- Tab: Testes -->
            <div class="tab-pane" id="tab-testes">
                <div class="testes-header">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchTeste" placeholder="Buscar teste...">
                    </div>
                    <button class="btn-adicionar" id="btnAdicionarTeste" style="display: none;">
                        <i class="fas fa-plus"></i>
                        <span>Novo Teste</span>
                    </button>
                </div>
                <div class="testes-grid" id="testesGrid">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Carregando testes...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Treinamento -->
    <div id="treinamentoModal" class="modal-aprimoramento" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="treinamentoModalTitle">Novo Treinamento</h3>
                <button class="modal-close" onclick="fecharModal('treinamentoModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="treinamentoForm">
                    <input type="hidden" id="treinamentoId">
                    <div class="form-group">
                        <label>Título *</label>
                        <input type="text" id="treinamentoTitulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="treinamentoDescricao" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Conteúdo / Material</label>
                        <textarea id="treinamentoConteudo" rows="5" placeholder="Texto do treinamento, links, etc..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Pontuação</label>
                        <input type="number" id="treinamentoPontos" value="10" min="0">
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="treinamentoCategoria">
                            <option value="iniciante">Iniciante</option>
                            <option value="intermediario">Intermediário</option>
                            <option value="avancado">Avançado</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancelar" onclick="fecharModal('treinamentoModal')">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Vídeo -->
    <div id="videoModal" class="modal-aprimoramento" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="videoModalTitle">Novo Vídeo</h3>
                <button class="modal-close" onclick="fecharModal('videoModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="videoForm">
                    <input type="hidden" id="videoId">
                    <div class="form-group">
                        <label>Título *</label>
                        <input type="text" id="videoTitulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="videoDescricao" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>URL do Vídeo (YouTube/Vimeo)</label>
                        <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="form-group">
                        <label>Duração (minutos)</label>
                        <input type="number" id="videoDuracao" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label>Pontuação</label>
                        <input type="number" id="videoPontos" value="5" min="0">
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="videoCategoria">
                            <option value="iniciante">Iniciante</option>
                            <option value="intermediario">Intermediário</option>
                            <option value="avancado">Avançado</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancelar" onclick="fecharModal('videoModal')">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Teste -->
    <div id="testeModal" class="modal-aprimoramento modal-lg" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="testeModalTitle">Novo Teste</h3>
                <button class="modal-close" onclick="fecharModal('testeModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="testeForm">
                    <input type="hidden" id="testeId">
                    <div class="form-group">
                        <label>Título *</label>
                        <input type="text" id="testeTitulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="testeDescricao" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Pontuação Máxima</label>
                        <input type="number" id="testePontosMax" value="100" min="0">
                    </div>
                    <div class="form-group">
                        <label>Pontuação Mínima para Aprovação (%)</label>
                        <input type="number" id="testePontosMin" value="70" min="0" max="100">
                    </div>
                    
                    <h4>Questões</h4>
                    <div id="questoesContainer"></div>
                    <button type="button" class="btn-add-questao" id="btnAddQuestao">+ Adicionar Questão</button>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-cancelar" onclick="fecharModal('testeModal')">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar Teste</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Realizar Teste -->
    <div id="realizarTesteModal" class="modal-aprimoramento modal-lg" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="testeRealizarTitulo">Realizar Teste</h3>
                <button class="modal-close" onclick="fecharModal('realizarTesteModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="testeQuestoesContainer"></div>
                <div class="form-actions">
                    <button type="button" class="btn-cancelar" onclick="fecharModal('realizarTesteModal')">Cancelar</button>
                    <button type="button" class="btn-enviar-respostas" id="btnEnviarRespostas">Enviar Respostas</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ver Vídeo -->
    <div id="verVideoModal" class="modal-aprimoramento modal-video" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="videoVerTitulo">Assistir Vídeo</h3>
                <button class="modal-close" onclick="fecharModal('verVideoModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="video-player">
                    <iframe id="videoIframe" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <p id="videoVerDescricao"></p>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-marcar-assistido" id="btnMarcarAssistido">Marcar como Assistido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h3 id="loadingMessage">Carregando...</h3>
        </div>
    </div>

    <!-- Message Alert -->
    <div id="messageAlert" class="message-alert" style="display: none;">
        <div class="message-content">
            <i class="message-icon"></i>
            <span class="message-text"></span>
        </div>
        <button class="message-close" onclick="this.parentElement.style.display='none'">×</button>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Login Firebase -->
    <script src="../../login_firebase.js"></script>
    
    <!-- Módulo da Loja (como module) -->
    <script type="module" src="novo_firebase_config.js"></script>
    
    <!-- Script principal (NÃO é module, usa funções globais) -->
    <script src="programas_aprimoramento.js"></script>
</body>
</html>
